type Query {
  _empty: String
  bead(id: ID!): Bead
  commandAllowlist(agentId: ID!): [AllowlistEntry!]!
  file(path: String!): File
  agentJobs: [AgentJob!]!
  agentJob(id: ID!): AgentJob
  agentLogs(agentId: ID!, first: Int, after: String, last: Int, before: String): AgentLogConnection!
  taskLogs(taskId: ID!, first: Int, after: String, last: Int, before: String): AgentLogConnection!
  pendingInboxMessages(agentId: ID!, taskId: String): [PendingInboxMessage!]!
  "Build TTS audio URLs for a completed agent log message, one per sentence"
  speechUrls(logId: ID!): [String!]!
  "Build TTS audio URLs for arbitrary text using an agent's voice config"
  documentSpeechUrls(text: String!, agentId: ID!): [String!]!
  agents: [Agent!]!
  agent(id: ID!): Agent
  avatars: [Avatar!]!
  pendingCommandApprovals: [CommandApproval!]!
  integrationProviders: [IntegrationProvider!]!
  integrationConnections(excludeCategory: String): [IntegrationConnection!]!
  defaultModel: DefaultModel
  defaultImageModel: DefaultModel
  defaultSpeechModel: DefaultModel
  enabledModels(providerId: String!): [String!]!
  allEnabledModels: [EnabledModelEntry!]!
  awsPresetRoles: [AwsPresetRole!]!
  awsSetupInfo: AwsSetupInfo!
  providerModels(providerId: String!): [ProviderModelInfo!]!
  enabledModelDetails(providerId: String!): [ModelInfo!]!
  speechVoices(connectionId: String!): [SpeechVoice!]!
  logos: [Logo!]!
  userInputRequests: [UserInputRequest!]!
  profile: Profile!
  globalSettings: GlobalSettings!
  "All skill templates from the catalog"
  skillTemplates: [SkillTemplate!]!
  "Single skill template by ID"
  skillTemplate(id: ID!): SkillTemplate
  "Skills assigned to a specific agent"
  agentSkills(agentId: ID!): [AgentSkill!]!
  tasks(first: Int, after: String, last: Int, before: String): TaskConnection!
  task(id: ID!): Task
  workspaceEntries(path: String!): [WorkspaceEntry!]!
  workspaceFile(path: String!): String
  workspaceSearch(query: String!, mode: SearchMode = ALL): [WorkspaceSearchResult!]!
}

type Mutation {
  _empty: String
  addCommandAllowlistEntry(agentId: ID!, pattern: String!): [AllowlistEntry!]!
  removeCommandAllowlistEntry(agentId: ID!, pattern: String!): [AllowlistEntry!]!
  requestFileUploads(agentId: String!, taskId: String, files: [FileUploadRequest!]!): [FileUploadUrl!]!
  completeFileUpload(input: CompleteFileUploadInput!): CompletedFileUpload!
  attachFileReference(input: AttachFileReferenceInput!): Boolean!
  updateAgentJob(id: ID!, input: UpdateAgentJobInput!): AgentJob
  createAgentJob(input: CreateAgentJobInput!): AgentJob!
  deleteAgentJob(id: ID!): AgentJob
  triggerJob(id: ID!): AgentJob!
  sendMessage(agentId: ID!, content: String!, taskId: String): SendMessageResult!
  "Clear visible log history for an agent's main lane or a specific task lane"
  clearAgentLog(agentId: ID!, taskId: String): ClearAgentLogResult!
  createAgent(input: CreateAgentInput!): Agent!
  updateAgent(id: ID!, input: UpdateAgentInput!): Agent
  retireAgent(id: ID!): Agent!
  unretireAgent(id: ID!): Agent!
  resolveCommandApproval(id: ID!, decision: CommandApprovalDecision!): CommandApproval
  connectApiKey(providerId: String!, apiKey: String!): ConnectApiKeyResult!
  revokeIntegrationConnection(id: ID!): IntegrationConnection!
  setDefaultModel(providerId: String!, modelId: String!): DefaultModel!
  setDefaultImageModel(providerId: String!, modelId: String!): DefaultModel!
  setDefaultSpeechModel(providerId: String!, modelId: String!): DefaultModel!
  enableModel(providerId: String!, modelId: String!, modelName: String): [EnabledModelEntry!]!
  disableModel(providerId: String!, modelId: String!): [EnabledModelEntry!]!
  connectAwsIamRole(roleArn: String!, displayName: String, region: String): IntegrationConnection!
  submitOAuthConnection(providerId: String!, accessToken: String!, refreshToken: String, expiresAt: String, scopes: [String!]!, accountId: String, clientId: String): IntegrationConnection!
  resolveUserInputRequest(id: ID!, action: String!): UserInputRequest
  dismissUserInputRequest(id: ID!): UserInputRequest
  updateProfile(input: ProfileInput!): Profile!
  updateGlobalSettings(signupDisabled: Boolean): GlobalSettings!
  "Assign a skill to an agent"
  assignSkill(agentId: ID!, skillId: ID!): AgentSkill!
  "Remove a skill from an agent"
  removeSkill(agentId: ID!, skillId: ID!): AgentSkill!
  "Bind a connection to an agent's skill"
  bindAgentSkillConnection(agentId: ID!, skillId: ID!, provider: String!, connectionId: ID!): AgentSkill!
  "Unbind a connection from an agent's skill"
  unbindAgentSkillConnection(agentId: ID!, skillId: ID!, provider: String!, connectionId: ID!): AgentSkill!
  """Delete one or more workspace files or directories"""
  deleteWorkspaceEntries(paths: [String!]!): WorkspaceMutationResult!
  """Move one or more workspace entries to a destination directory"""
  moveWorkspaceEntries(paths: [String!]!, destination: String!): WorkspaceMutationResult!
  """Create a new folder at the given path"""
  createWorkspaceFolder(path: String!): String!
}

type Subscription {
  _empty: String
  beadUpdated(id: ID!): Bead
  jobCreated: AgentJob!
  agentLogCreated(agentId: ID!): AgentLog!
  "Subscribe to log entries by agentId or taskId"
  logCreated(agentId: ID, taskId: ID): AgentLog!
  agentStream(agentId: ID!): AgentStreamDelta!
  "Subscribe to sentence-level TTS audio URLs by agentId or taskId"
  speechStream(agentId: ID, taskId: ID): SpeechAudioChunk!
  agentUpdated(agentId: ID!): Agent!
  agentsUpdated(agentIds: [ID!]!): Agent!
  pendingItemsUpdated: Boolean!
  taskUpdated(taskId: ID!): Task!
  tasksUpdated(taskIds: [ID!]!): Task!
  jobTaskCreated(jobId: ID!): Task!
  taskLogCreated(taskId: ID!): AgentLog!
  sandboxOutput(taskId: ID!): SandboxOutput!
}

enum BeadStatus {
  OPEN
  IN_PROGRESS
  BLOCKED
  CLOSED
}

type Bead {
  id: ID!
  title: String!
  status: BeadStatus!
  assignee: String
  assigneeName: String
  parentId: ID
  latestComment: String
  children: [Bead!]
}

type AllowlistEntry {
  pattern: String!
}

union Attachment = FileAttachment | LinkAttachment

type FileAttachment {
  file: File
}

type LinkAttachment {
  url: String!
  title: String
  description: String
}

type File {
  path: String!
  name: String!
  sizeBytes: Int!
  mimeType: String
  modifiedAt: String!
  fileType: FileType!
  render: FileRender!
}

union FileRender = ImageRender | DocumentRender | CodeRender | AudioRender | VideoRender | PdfRender | UnknownRender

type ImageRender {
  url(width: Int): String!
  aspectRatio: Float
  width: Int
  height: Int
}

type DocumentRender {
  markdown: String!
  title: String
}

type CodeRender {
  content: String!
  language: String!
}

type AudioRender {
  url: String!
  durationSeconds: Float
}

type VideoRender {
  url: String!
  thumbnailUrl(width: Int): String
  durationSeconds: Float
}

type PdfRender {
  url: String!
}

type UnknownRender {
  mimeType: String
  sizeBytes: Int!
}

input FileUploadRequest {
  filename: String!
  contentType: String!
  sizeBytes: Int!
}

type FileUploadUrl {
  uploadId: String!
  presignedUrl: String!
  key: String!
}

input CompleteFileUploadInput {
  agentId: String!
  taskId: String
  key: String!
  filename: String!
  contentType: String!
  sizeBytes: Int!
}

type CompletedFileUpload {
  path: String!
  filename: String!
  sizeBytes: Int!
  contentType: String!
}

"Attach a reference to an existing workspace file in an agent's log (no upload needed)."
input AttachFileReferenceInput {
  agentId: String!
  taskId: String
  "Workspace-relative path, e.g. uploads/2026-04-10/notes.md"
  filePath: String!
}

