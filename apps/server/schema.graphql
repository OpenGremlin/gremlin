type Query {
  _empty: String
  agentJobs: [AgentJob!]!
  agentJob(id: ID!): AgentJob
  agentLogs(
    agentId: ID!
    first: Int
    after: String
    last: Int
    before: String
  ): AgentLogConnection!
  taskLogs(
    taskId: ID!
    first: Int
    after: String
    last: Int
    before: String
  ): AgentLogConnection!
  agents: [Agent!]!
  agent(id: ID!): Agent
  avatars: [Avatar!]!
  integrationProviders: [IntegrationProvider!]!
  integrationConnections: [IntegrationConnection!]!
  defaultModel: DefaultModel
  bedrockEnabledModels: [String!]!
  notifications: [Notification!]!
  profile: Profile!
  globalSettings: GlobalSettings!
  "All skill templates from the catalog"
  skillTemplates: [SkillTemplate!]!
  "Single skill template by ID"
  skillTemplate(id: ID!): SkillTemplate
  "Skills assigned to a specific agent"
  agentSkills(agentId: ID!): [AgentSkill!]!
  tasks(first: Int, after: String, last: Int, before: String): TaskConnection!
  task(id: ID!): Task
  workspaceEntries(path: String!): [WorkspaceEntry!]!
  workspaceFile(path: String!): String
}

type Mutation {
  _empty: String
  requestFileUploads(
    agentId: String!
    taskId: String
    files: [FileUploadRequest!]!
  ): [FileUploadUrl!]!
  completeFileUpload(input: CompleteFileUploadInput!): CompletedFileUpload!
  updateAgentJob(id: ID!, input: UpdateAgentJobInput!): AgentJob
  createAgentJob(input: CreateAgentJobInput!): AgentJob!
  deleteAgentJob(id: ID!): AgentJob
  triggerJob(id: ID!): Boolean!
  sendMessage(
    agentId: ID!
    content: String!
    taskId: String
  ): SendMessageResult!
  createAgent(input: CreateAgentInput!): Agent!
  updateAgent(id: ID!, input: UpdateAgentInput!): Agent
  retireAgent(id: ID!): Agent!
  unretireAgent(id: ID!): Agent!
  connectApiKey(providerId: String!, apiKey: String!): ID!
  revokeIntegrationConnection(id: ID!): Boolean!
  setDefaultModel(providerId: String!, modelId: String!): Boolean!
  enableBedrockModel(modelId: String!): Boolean!
  disableBedrockModel(modelId: String!): Boolean!
  submitOAuthConnection(
    providerId: String!
    accessToken: String!
    refreshToken: String
    expiresAt: String
    scopes: [String!]!
    accountId: String
    clientId: String
    clientSecret: String
    tokenUrl: String
    tokenAuthMethod: String
  ): ID!
  resolveNotification(id: ID!, actionId: String!): Notification
  dismissNotification(id: ID!): Notification
  updateProfile(input: ProfileInput!): Profile!
  updateGlobalSettings(signupDisabled: Boolean): GlobalSettings!
  "Assign a skill to an agent"
  assignSkill(agentId: ID!, skillId: ID!): AgentSkill!
  "Remove a skill from an agent"
  removeSkill(agentId: ID!, skillId: ID!): Boolean!
  "Bind a connection to an agent's skill"
  bindAgentSkillConnection(
    agentId: ID!
    skillId: ID!
    provider: String!
    connectionId: ID!
  ): AgentSkill!
  "Unbind a connection from an agent's skill"
  unbindAgentSkillConnection(
    agentId: ID!
    skillId: ID!
    provider: String!
    connectionId: ID!
  ): AgentSkill!
}

type Subscription {
  _empty: String
  jobCreated: AgentJob!
  agentLogCreated(agentId: ID!): AgentLog!
  agentUpdated(agentId: ID!): Agent!
  agentsUpdated(agentIds: [ID!]!): Agent!
  taskUpdated(taskId: ID!): Task!
  tasksUpdated(taskIds: [ID!]!): Task!
  jobTaskCreated(jobId: ID!): Task!
  taskLogCreated(taskId: ID!): AgentLog!
  sandboxOutput(taskId: ID!): SandboxOutput!
}

type Document {
  path: String!
  title: String!
  body: String
}

input FileUploadRequest {
  filename: String!
  contentType: String!
  sizeBytes: Int!
}

type FileUploadUrl {
  uploadId: String!
  presignedUrl: String!
  key: String!
}

input CompleteFileUploadInput {
  agentId: String!
  taskId: String
  key: String!
  filename: String!
  contentType: String!
  sizeBytes: Int!
}

type CompletedFileUpload {
  path: String!
  filename: String!
  sizeBytes: Int!
  contentType: String!
}

type AgentJob {
  id: ID!
  name: String!
  description: String!
  recurrence: String!
  cronExpression: String
  timezone: String!
  agent: Agent!
  paused: Boolean!
  lastRun: String
  nextRun: String
  tasks: [Task!]!
}

input UpdateAgentJobInput {
  name: String
  description: String
  recurrence: String
  agentId: String
  timezone: String
  paused: Boolean
}

input CreateAgentJobInput {
  name: String!
  description: String!
  recurrence: String!
  timezone: String!
  agentId: String!
}

enum AgentLogRole {
  AGENT
  USER
  SYSTEM
  TOOL
}

type AgentLog {
  id: ID!
  agent: Agent!
  taskId: String
  role: AgentLogRole!
  content: String!
  toolName: String
  toolInput: String
  toolResult: String
  documents: [Document!]!
  createdAt: String!
}

type AgentLogEdge {
  cursor: String!
  node: AgentLog!
}

type AgentLogPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type AgentLogConnection {
  edges: [AgentLogEdge!]!
  pageInfo: AgentLogPageInfo!
}

type SendMessageResult {
  queued: Boolean!
  content: String!
}

type AgentModelConfig {
  type: String!
  modelId: String
  connectionId: String
}

type AgentSandboxConfig {
  enabled: Boolean!
  idleTimeoutMinutes: Int
  alwaysOn: Boolean
}

type AgentWebSearchConfig {
  enabled: Boolean!
  provider: String
}

type AgentConfig {
  model: AgentModelConfig
  sandbox: AgentSandboxConfig
  webSearch: AgentWebSearchConfig
}

type Agent {
  id: ID!
  name: String!
  avatar: String!
  portraitId: String!
  imageUrl(width: Int): String!
  soul: String!
  retired: Boolean!
  ttsVoice: String
  config: AgentConfig
}

input AgentModelConfigInput {
  type: String!
  modelId: String
  connectionId: String
}

input AgentSandboxConfigInput {
  enabled: Boolean!
  idleTimeoutMinutes: Int
  alwaysOn: Boolean
}

input AgentWebSearchConfigInput {
  enabled: Boolean!
  provider: String
}

input AgentConfigInput {
  model: AgentModelConfigInput
  sandbox: AgentSandboxConfigInput
  webSearch: AgentWebSearchConfigInput
}

input UpdateAgentInput {
  name: String
  soul: String
  avatar: String
  ttsVoice: String
  config: AgentConfigInput
}

input CreateAgentInput {
  id: String!
  name: String!
  soul: String
}

type Avatar {
  id: ID!
  name: String!
  url(width: Int): String!
}

type AvailableScope {
  scope: String!
  label: String!
}

type ModelInfo {
  id: ID!
  name: String!
  contextWindow: Int!
  maxTokens: Int!
  reasoning: Boolean!
  inputCost: Float
  outputCost: Float
}

type DefaultModel {
  providerId: String!
  modelId: String!
}

type IntegrationProvider {
  id: ID!
  service: String!
  category: String!
  description: String!
  connectionType: String!
  availableScopes: [AvailableScope!]!
  models: [ModelInfo!]
  connectionCount: Int!
  hasConnection: Boolean!
}

type OAuthConnectionMeta {
  accountId: String
  scopes: [String!]!
  expiresAt: String
}

type ApiKeyConnectionMeta {
  accountId: String
}

union ConnectionMeta = OAuthConnectionMeta | ApiKeyConnectionMeta

type IntegrationConnection {
  id: ID!
  providerId: String!
  connectionType: String!
  connectedAt: String!
  isRevoked: Boolean!
  meta: ConnectionMeta!
}

enum NotificationType {
  PERMISSION
  APPROVAL
}

enum NotificationStatus {
  PENDING
  RESOLVED
  DISMISSED
}

type NotificationAction {
  id: String!
  label: String!
  style: String!
}

type Notification {
  id: ID!
  agent: Agent!
  type: NotificationType!
  turnId: String
  message: String!
  actions: [NotificationAction!]!
  status: NotificationStatus!
  resolvedAction: String
  createdAt: String!
}

type Profile {
  displayName: String!
  about: String!
  website: String
  timezone: String
}

input ProfileInput {
  displayName: String!
  about: String!
  website: String
  timezone: String
}

type GlobalSettings {
  signupDisabled: Boolean!
}

type SkillTemplate {
  id: ID!
  name: String!
  description: String!
  version: String!
  author: String
  category: String
  icon: String
  tags: [String!]
  hasInstall: Boolean!
  connections: [SkillConnectionRequirement!]!
}

type SkillConnectionRequirement {
  provider: String!
  providerName: String!
  reason: String!
  optional: Boolean!
  multi: Boolean!
  requestedScopes: [String!]
}

type AgentSkill {
  skillId: ID!
  agentId: ID!
  template: SkillTemplate
  assignedAt: String!
  connectionStatuses: [SkillConnectionStatus!]!
}

type SkillConnectionStatus {
  provider: String!
  providerName: String!
  reason: String!
  optional: Boolean!
  multi: Boolean!
  boundConnectionIds: [String!]!
  connected: Boolean!
}

type Task {
  id: ID!
  agent: Agent!
  title: String!
  message: String
  createdAt: String!
  updatedAt: String!
  completedAt: String
  originJobId: String
  imageUrl(width: Int): String
  artifacts: [String!]!
  documents: [Document!]!
  logs(
    first: Int
    after: String
    last: Int
    before: String
  ): AgentLogConnection!
}

type TaskEdge {
  cursor: String!
  node: Task!
}

type TaskPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type TaskConnection {
  edges: [TaskEdge!]!
  pageInfo: TaskPageInfo!
}

type SandboxOutput {
  commandId: String!
  stream: String!
  data: String!
  done: Boolean
  exitCode: Int
}

type WorkspaceEntry {
  name: String!
  path: String!
  isDirectory: Boolean!
  size: Int
  modifiedAt: String
  mimeType: String
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
