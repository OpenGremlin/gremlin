type Query {
  _empty: String
  commandAllowlist(agentId: ID!): [AllowlistEntry!]!
  file(path: String!): File
  agentJobs: [AgentJob!]!
  agentJob(id: ID!): AgentJob
  agentLogs(
    agentId: ID!
    first: Int
    after: String
    last: Int
    before: String
  ): AgentLogConnection!
  taskLogs(
    taskId: ID!
    first: Int
    after: String
    last: Int
    before: String
  ): AgentLogConnection!
  pendingInboxMessages(agentId: ID!, taskId: String): [PendingInboxMessage!]!
  agents: [Agent!]!
  agent(id: ID!): Agent
  avatars: [Avatar!]!
  pendingCommandApprovals: [CommandApproval!]!
  integrationProviders: [IntegrationProvider!]!
  integrationConnections(excludeCategory: String): [IntegrationConnection!]!
  defaultModel: DefaultModel
  defaultImageModel: DefaultModel
  defaultSpeechModel: DefaultModel
  enabledModels(providerId: String!): [String!]!
  allEnabledModels: [EnabledModelEntry!]!
  bedrockEnabledModels: [String!]!
  awsPresetRoles: [AwsPresetRole!]!
  awsSetupInfo: AwsSetupInfo!
  bedrockAvailableModels: [ModelInfo!]!
  providerModels(providerId: String!): [ProviderModelInfo!]!
  enabledModelDetails(providerId: String!): [ModelInfo!]!
  speechVoices(providerId: String!): [SpeechVoice!]!
  userInputRequests: [UserInputRequest!]!
  profile: Profile!
  globalSettings: GlobalSettings!
  "All skill templates from the catalog"
  skillTemplates: [SkillTemplate!]!
  "Single skill template by ID"
  skillTemplate(id: ID!): SkillTemplate
  "Skills assigned to a specific agent"
  agentSkills(agentId: ID!): [AgentSkill!]!
  tasks(first: Int, after: String, last: Int, before: String): TaskConnection!
  task(id: ID!): Task
  workspaceEntries(path: String!): [WorkspaceEntry!]!
  workspaceFile(path: String!): String
}

type Mutation {
  _empty: String
  addCommandAllowlistEntry(agentId: ID!, pattern: String!): [AllowlistEntry!]!
  removeCommandAllowlistEntry(
    agentId: ID!
    pattern: String!
  ): [AllowlistEntry!]!
  requestFileUploads(
    agentId: String!
    taskId: String
    files: [FileUploadRequest!]!
  ): [FileUploadUrl!]!
  completeFileUpload(input: CompleteFileUploadInput!): CompletedFileUpload!
  updateAgentJob(id: ID!, input: UpdateAgentJobInput!): AgentJob
  createAgentJob(input: CreateAgentJobInput!): AgentJob!
  deleteAgentJob(id: ID!): AgentJob
  triggerJob(id: ID!): AgentJob!
  sendMessage(
    agentId: ID!
    content: String!
    taskId: String
  ): SendMessageResult!
  createAgent(input: CreateAgentInput!): Agent!
  updateAgent(id: ID!, input: UpdateAgentInput!): Agent
  retireAgent(id: ID!): Agent!
  unretireAgent(id: ID!): Agent!
  resolveCommandApproval(
    id: ID!
    decision: CommandApprovalDecision!
  ): CommandApproval
  connectApiKey(providerId: String!, apiKey: String!): ConnectApiKeyResult!
  revokeIntegrationConnection(id: ID!): IntegrationConnection!
  setDefaultModel(providerId: String!, modelId: String!): DefaultModel!
  setDefaultImageModel(providerId: String!, modelId: String!): DefaultModel!
  setDefaultSpeechModel(providerId: String!, modelId: String!): DefaultModel!
  enableModel(
    providerId: String!
    modelId: String!
    modelName: String
  ): [EnabledModelEntry!]!
  disableModel(providerId: String!, modelId: String!): [EnabledModelEntry!]!
  enableBedrockModel(modelId: String!, modelName: String): [String!]!
  disableBedrockModel(modelId: String!): [String!]!
  connectAwsIamRole(
    roleArn: String!
    displayName: String
    region: String
  ): IntegrationConnection!
  submitOAuthConnection(
    providerId: String!
    accessToken: String!
    refreshToken: String
    expiresAt: String
    scopes: [String!]!
    accountId: String
    clientId: String
  ): IntegrationConnection!
  resolveUserInputRequest(id: ID!, action: String!): UserInputRequest
  dismissUserInputRequest(id: ID!): UserInputRequest
  updateProfile(input: ProfileInput!): Profile!
  updateGlobalSettings(signupDisabled: Boolean): GlobalSettings!
  "Assign a skill to an agent"
  assignSkill(agentId: ID!, skillId: ID!): AgentSkill!
  "Remove a skill from an agent"
  removeSkill(agentId: ID!, skillId: ID!): AgentSkill!
  "Bind a connection to an agent's skill"
  bindAgentSkillConnection(
    agentId: ID!
    skillId: ID!
    provider: String!
    connectionId: ID!
  ): AgentSkill!
  "Unbind a connection from an agent's skill"
  unbindAgentSkillConnection(
    agentId: ID!
    skillId: ID!
    provider: String!
    connectionId: ID!
  ): AgentSkill!
}

type Subscription {
  _empty: String
  jobCreated: AgentJob!
  agentLogCreated(agentId: ID!): AgentLog!
  "Subscribe to log entries by agentId or taskId"
  logCreated(agentId: ID, taskId: ID): AgentLog!
  agentStream(agentId: ID!): AgentStreamDelta!
  "Subscribe to sentence-level TTS audio URLs by agentId or taskId"
  speechStream(agentId: ID, taskId: ID): SpeechAudioChunk!
  agentUpdated(agentId: ID!): Agent!
  agentsUpdated(agentIds: [ID!]!): Agent!
  pendingItemsUpdated: Boolean!
  taskUpdated(taskId: ID!): Task!
  tasksUpdated(taskIds: [ID!]!): Task!
  jobTaskCreated(jobId: ID!): Task!
  taskLogCreated(taskId: ID!): AgentLog!
  sandboxOutput(taskId: ID!): SandboxOutput!
}

type AllowlistEntry {
  pattern: String!
}

union Attachment = FileAttachment | LinkAttachment

type FileAttachment {
  file: File!
}

type LinkAttachment {
  url: String!
  title: String
  description: String
}

type Document {
  path: String!
  title: String!
  body: String
}

type File {
  path: String!
  name: String!
  sizeBytes: Int!
  mimeType: String
  modifiedAt: String!
  render: FileRender!
}

union FileRender =
  | ImageRender
  | DocumentRender
  | CodeRender
  | AudioRender
  | VideoRender
  | UnknownRender

type ImageRender {
  url(width: Int): String
  aspectRatio: Float
  width: Int
  height: Int
}

type DocumentRender {
  markdown: String!
  title: String
}

type CodeRender {
  content: String!
  language: String!
}

type AudioRender {
  url: String
  durationSeconds: Float
}

type VideoRender {
  url: String
  thumbnailUrl(width: Int): String
  durationSeconds: Float
}

type UnknownRender {
  mimeType: String
  sizeBytes: Int!
}

input FileUploadRequest {
  filename: String!
  contentType: String!
  sizeBytes: Int!
}

type FileUploadUrl {
  uploadId: String!
  presignedUrl: String!
  key: String!
}

input CompleteFileUploadInput {
  agentId: String!
  taskId: String
  key: String!
  filename: String!
  contentType: String!
  sizeBytes: Int!
}

type CompletedFileUpload {
  path: String!
  filename: String!
  sizeBytes: Int!
  contentType: String!
}

type AgentJob {
  id: ID!
  name: String!
  description: String!
  recurrence: String!
  cronExpression: String
  timezone: String!
  agent: Agent!
  paused: Boolean!
  lastRun: String
  nextRun: String
  tasks: [Task!]!
}

input UpdateAgentJobInput {
  name: String
  description: String
  recurrence: String
  agentId: String
  timezone: String
  paused: Boolean
}

input CreateAgentJobInput {
  name: String!
  description: String!
  recurrence: String!
  timezone: String!
  agentId: String!
}

enum AgentLogRole {
  AGENT
  USER
  SYSTEM
  TOOL
}

enum ToolName {
  updateTaskMessage
  postToMainLane
  backgroundTask
  requestUserInput
  readFile
  writeFile
  editFile
  listFiles
  glob
  grep
  attachFile
  attachLink
  ensureSandbox
  runCommand
  readCommandOutput
  viewImage
  generateImage
  generateSpeech
  webSearch
  webFetch
  readSkill
  readSkillReference
  authenticate
  saveMemory
  recallMemory
  listJobs
  scheduleJob
  updateJob
}

type AgentLog {
  id: ID!
  agent: Agent!
  taskId: String
  role: AgentLogRole!
  content: String!
  toolName: ToolName
  toolInput: String
  toolResult: String
  displayHint: String
  displayVariant: String
  commandApprovalId: String
  attachments: [Attachment!]!
  documents: [Document!]! @deprecated(reason: "Use attachments instead")
  files: [File!]! @deprecated(reason: "Use attachments instead")
  createdAt: String!
}

type AgentLogEdge {
  cursor: String!
  node: AgentLog!
}

type AgentLogPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type AgentLogConnection {
  edges: [AgentLogEdge!]!
  pageInfo: AgentLogPageInfo!
}

type PendingInboxMessage {
  id: ID!
  content: String!
  createdAt: String!
}

type SendMessageResult {
  queued: Boolean!
  content: String!
}

type AgentStreamDelta {
  logId: ID!
  agentId: ID!
  taskId: String
  delta: String!
  done: Boolean!
}

type SpeechAudioChunk {
  logId: ID!
  agentId: ID!
  sentenceIndex: Int!
  url: String!
  done: Boolean!
}

type AgentModelConfig {
  type: String!
  modelId: String
  connectionId: String
}

type AgentSandboxConfig {
  enabled: Boolean!
  idleTimeoutMinutes: Int
  alwaysOn: Boolean
  commandApproval: String!
}

type AgentWebSearchConfig {
  enabled: Boolean!
  provider: String
}

type AgentReasoningConfig {
  enabled: Boolean!
}

type AgentViewImageConfig {
  enabled: Boolean!
}

type AgentImageGenerationConfig {
  enabled: Boolean!
}

type AgentSpeechConfig {
  enabled: Boolean!
  voice: String
}

type AgentConfig {
  model: AgentModelConfig
  imageModel: AgentModelConfig
  speechModel: AgentModelConfig
  sandbox: AgentSandboxConfig
  webSearch: AgentWebSearchConfig
  reasoning: AgentReasoningConfig
  viewImage: AgentViewImageConfig
  imageGeneration: AgentImageGenerationConfig
  speech: AgentSpeechConfig
}

type Agent {
  id: ID!
  name: String!
  avatar: String!
  portraitId: String!
  imageUrl(width: Int): String!
  personality: String
  role: String
  retired: Boolean!
  ttsVoice: String
  config: AgentConfig
}

input AgentModelConfigInput {
  type: String!
  modelId: String
  connectionId: String
}

input AgentSandboxConfigInput {
  enabled: Boolean!
  idleTimeoutMinutes: Int
  alwaysOn: Boolean
  commandApproval: String!
}

input AgentWebSearchConfigInput {
  enabled: Boolean!
  provider: String
}

input AgentReasoningConfigInput {
  enabled: Boolean!
}

input AgentViewImageConfigInput {
  enabled: Boolean!
}

input AgentImageGenerationConfigInput {
  enabled: Boolean!
}

input AgentSpeechConfigInput {
  enabled: Boolean!
  voice: String
}

input AgentConfigInput {
  model: AgentModelConfigInput
  imageModel: AgentModelConfigInput
  speechModel: AgentModelConfigInput
  sandbox: AgentSandboxConfigInput
  webSearch: AgentWebSearchConfigInput
  reasoning: AgentReasoningConfigInput
  viewImage: AgentViewImageConfigInput
  imageGeneration: AgentImageGenerationConfigInput
  speech: AgentSpeechConfigInput
}

input UpdateAgentInput {
  name: String
  personality: String
  role: String
  avatar: String
  ttsVoice: String
  config: AgentConfigInput
}

input CreateAgentInput {
  id: String!
  name: String!
  personality: String
  role: String
}

type Avatar {
  id: ID!
  name: String!
  url(width: Int): String!
}

enum CommandApprovalStatus {
  PENDING
  RESOLVED
}

enum CommandApprovalDecision {
  ALLOW_ONCE
  ALLOW_ALWAYS
  DENY
}

type CommandApproval {
  id: ID!
  agent: Agent!
  taskId: String!
  command: String!
  reason: String!
  status: CommandApprovalStatus!
  decision: String
  createdAt: String!
  resolvedAt: String
}

type AvailableScope {
  scope: String!
  label: String!
}

type ModelInfo {
  id: ID!
  name: String!
  mode: String!
  maxInputTokens: Int
  inputCostPerToken: Float
  outputCostPerToken: Float
  supportedModalities: [String!]
  supportedOutputModalities: [String!]
  inputCostPerImage: Float
  inputCostPerImageToken: Float
  outputCostPerImage: Float
  outputCostPerImageToken: Float
  supportsReasoning: Boolean
}

type SpeechVoice {
  id: String!
  name: String!
  description: String
  previewUrl: String
}

type DefaultModel {
  providerId: String!
  modelId: String!
  modelName: String
}

type ProviderModelInfo {
  id: ID!
  name: String!
  mode: String!
}

type EnabledModelEntry {
  providerId: String!
  modelId: String!
  modelName: String
  modelMode: String!
}

type ConnectApiKeyResult {
  connectionId: ID!
  models: [ProviderModelInfo!]!
}

type OAuthPlatformOverride {
  clientId: String!
  redirectUri: String!
}

type IntegrationProvider {
  id: ID!
  service: String!
  category: String!
  description: String!
  connectionType: String!
  availableScopes: [AvailableScope!]!
  models: [ModelInfo!]
  connectionCount: Int!
  hasConnection: Boolean!
  authorizeUrl: String
  tokenUrl: String
  defaultClientId: String
  defaultScopes: [String!]
  scopePrefix: String
  extraAuthParams: String
  userInfo: String
  ios: OAuthPlatformOverride
  android: OAuthPlatformOverride
}

type OAuthConnectionMeta {
  accountId: String
  scopes: [String!]!
  expiresAt: String
}

type ApiKeyConnectionMeta {
  accountId: String
}

type AwsIamRoleConnectionMeta {
  accountId: String
  roleArn: String!
  region: String
  displayName: String
}

type AwsPresetRole {
  id: String!
  name: String!
  description: String!
  roleArn: String!
}

type AwsSetupInfo {
  trustPolicy: String!
}

union ConnectionMeta =
  | OAuthConnectionMeta
  | ApiKeyConnectionMeta
  | AwsIamRoleConnectionMeta

type IntegrationConnection {
  id: ID!
  providerId: String!
  provider: IntegrationProvider!
  connectionType: String!
  connectedAt: String!
  isRevoked: Boolean!
  meta: ConnectionMeta!
}

enum UserInputRequestStatus {
  PENDING
  RESOLVED
  DISMISSED
}

type UserInputRequestAction {
  label: String!
  style: String!
}

type UserInputRequest {
  id: ID!
  agent: Agent!
  turnId: String
  message: String!
  actions: [UserInputRequestAction!]!
  status: UserInputRequestStatus!
  resolvedAction: String
  createdAt: String!
}

type Profile {
  displayName: String!
  about: String!
  website: String
  timezone: String
}

input ProfileInput {
  displayName: String!
  about: String!
  website: String
  timezone: String
}

type GlobalSettings {
  signupDisabled: Boolean!
}

type SkillTemplate {
  id: ID!
  name: String!
  displayName: String
  description: String!
  version: String!
  author: String
  category: String
  icon: String
  tags: [String!]
  hasInstall: Boolean!
  install: String
  allowedCommands: [String!]
  connections: [SkillConnectionRequirement!]!
  "Markdown body of SKILL.md (without YAML frontmatter)"
  instructions: String
}

type SkillConnectionRequirement {
  provider: String!
  providerName: String!
  reason: String!
  optional: Boolean!
  multi: Boolean!
  requestedScopes: [String!]
}

type AgentSkill {
  skillId: ID!
  agentId: ID!
  template: SkillTemplate
  assignedAt: String!
  connectionStatuses: [SkillConnectionStatus!]!
}

type SkillConnectionStatus {
  provider: String!
  providerName: String!
  reason: String!
  optional: Boolean!
  multi: Boolean!
  boundConnectionIds: [String!]!
  connected: Boolean!
}

type Task {
  id: ID!
  agent: Agent!
  title: String!
  message: String
  createdAt: String!
  updatedAt: String!
  completedAt: String
  originJobId: String
  emoji: String
  attachments: [Attachment!]!
  documents: [Document!]! @deprecated(reason: "Use attachments instead")
  files: [File!]! @deprecated(reason: "Use attachments instead")
  logs(
    first: Int
    after: String
    last: Int
    before: String
  ): AgentLogConnection!
}

type TaskEdge {
  cursor: String!
  node: Task!
}

type TaskPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type TaskConnection {
  edges: [TaskEdge!]!
  pageInfo: TaskPageInfo!
}

type SandboxOutput {
  commandId: String!
  stream: String!
  data: String!
  done: Boolean
  exitCode: Int
}

type WorkspaceEntry {
  name: String!
  path: String!
  isDirectory: Boolean!
  size: Int
  modifiedAt: String
  mimeType: String
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
