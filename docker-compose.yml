# Local development infrastructure
#
# Setup:
#   1. docker compose up -d                            # DynamoDB, SQS, Scheduler auto-created via init hook
#   2. pnpm --filter @gremlin/server run db:seed       # Seed agent data
#   3. Uncomment LOCALSTACK_ENDPOINT and DOORBELL_QUEUE_URL in .env
#   4. pnpm --filter @gremlin/server dev
#
# LocalStack provides local DynamoDB, SQS, and EventBridge Scheduler.
# Bedrock and S3 Vectors remain cloud-connected.
# Data is in-memory and resets when the container stops.

services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
    environment:
      - SERVICES=dynamodb,sqs,scheduler
